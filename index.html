<!DOCTYPE html>
<html lang="en" class=""><head><script>window.livecodes = window.livecodes || {};</script><title>Nav worker </title><meta name="title" content="Nav worker "><meta name="description" content="Employee task manager "><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="./style.css"><script src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js" async=""></script><script type="importmap">{
  "imports": {}
}</script></head><body>



    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .hidden { display: none; }
    </style>


    <!-- Login/Register View -->
    <div id="auth-view" class="max-w-md mx-auto">
        <div class="bg-white p-8 rounded-2xl shadow-lg">
            <h1 class="text-2xl font-bold text-center mb-6">Worker Portal</h1>
            <div id="login-section">
                <h2 class="text-xl font-semibold mb-4">Login</h2>
                <form id="login-form" class="space-y-4">
                    <div>
                        <label for="login-mobile" class="block text-sm font-medium text-gray-700">Mobile Number</label>
                        <input type="tel" id="login-mobile" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm" required="" pattern="\d{10}">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 font-semibold">Login</button>
                </form>
                <p class="text-center text-sm mt-4">New worker? <button id="show-register-btn" class="text-indigo-600 hover:underline">Register here</button></p>
            </div>
            <div id="register-section" class="hidden">
                <h2 class="text-xl font-semibold mb-4">Register</h2>
                <form id="register-form" class="space-y-4">
                    <div>
                        <label for="register-name" class="block text-sm font-medium text-gray-700">Your Name</label>
                        <input type="text" id="register-name" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm" required="">
                    </div>
                    <div>
                        <label for="register-mobile" class="block text-sm font-medium text-gray-700">Mobile Number (10 digits)</label>
                        <input type="tel" id="register-mobile" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm" required="" pattern="\d{10}">
                    </div>
                     <div>
                        <label for="register-specialization" class="block text-sm font-medium text-gray-700">Specialization</label>
                        <input type="text" id="register-specialization" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm" required="" placeholder="e.g., Alterations, Stitching">
                    </div>
                    <button type="submit" class="w-full bg-green-600 text-white py-2 px-4 rounded-md hover:bg-green-700 font-semibold">Register</button>
                </form>
                <p class="text-center text-sm mt-4">Already registered? <button id="show-login-btn" class="text-indigo-600 hover:underline">Login here</button></p>
            </div>
        </div>
        <p class="text-center text-xs text-gray-400 mt-4"><a href="Pc.html" class="hover:underline">Back to Project Hub</a></p>
    </div>

    <!-- Dashboard View -->
    <div id="dashboard-view" class="hidden max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-6">
            <div>
                 <h1 class="text-3xl font-bold text-gray-800">Today's Tasks</h1>
                 <p class="text-gray-600">Welcome, <span id="worker-name" class="font-semibold"></span>!</p>
            </div>
            <div class="flex items-center gap-4">
                 <div id="notification-bell" class="relative">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                    <span id="notification-badge" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full h-4 w-4 flex items-center justify-center hidden"></span>
                </div>
                <button id="logout-btn" class="text-sm font-semibold text-red-600 hover:underline">Logout</button>
            </div>
        </header>
        <div class="bg-white p-6 rounded-lg shadow-md">
            <div class="max-h-[70vh] overflow-y-auto">
                <table class="w-full text-sm text-left">
                    <thead class="text-xs text-gray-700 uppercase bg-gray-50 sticky top-0">
                        <tr>
                            <th class="px-4 py-3">Order</th>
                            <th class="px-4 py-3">Task Details</th>
                            <th class="px-4 py-3">Status</th>
                            <th class="px-4 py-3">Actions / ETA</th>
                        </tr>
                    </thead>
                    <tbody id="tasks-tbody">
                        <!-- Task rows will be injected here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="toast" class="hidden fixed bottom-5 right-5 bg-gray-900 text-white py-2 px-4 rounded-lg shadow-lg"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC0_DQIiyaVQllFH4pxH1Dm3r2kFXXoOgc",
            authDomain: "navrosetailorapp.firebaseapp.com",
            databaseURL: "https://navrosetailorapp-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "navrosetailorapp"
        };
        
        let db;
        let currentUser = null;
        let myTasks = {};

        // DOM Elements
        const authView = document.getElementById('auth-view');
        const dashboardView = document.getElementById('dashboard-view');
        const loginSection = document.getElementById('login-section');
        const registerSection = document.getElementById('register-section');
        const notificationBadge = document.getElementById('notification-badge');

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 4000);
        }

        function speak(text) {
            if (!('speechSynthesis' in window)) return;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-IN';
            speechSynthesis.speak(utterance);
        }

        function displayTasks(tasks) {
            const tbody = document.getElementById('tasks-tbody');
            tbody.innerHTML = '';
            
            const tasksArray = Object.entries(tasks).filter(([key, task]) => task.assignedTo === currentUser.id && task.status !== 'Completed');
            
            if (tasksArray.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center p-8 text-gray-500">No active tasks assigned to you.</td></tr>';
                notificationBadge.classList.add('hidden');
                return;
            }

            notificationBadge.textContent = tasksArray.length;
            notificationBadge.classList.remove('hidden');

            tasksArray.sort(([, a], [, b]) => a.timestamp - b.timestamp).forEach(([taskId, task]) => {
                let statusHtml;
                let actionsHtml;
                
                switch(task.status) {
                    case 'Pending':
                        statusHtml = '<span class="px-2 py-1 text-xs font-semibold rounded-full bg-yellow-200 text-yellow-800">Pending</span>';
                        actionsHtml = `<button onclick="updateTaskStatus('${taskId}', 'In Progress')" class="bg-blue-500 text-white text-xs font-semibold py-1 px-3 rounded-md">Start Work</button>`;
                        break;
                    case 'In Progress':
                        statusHtml = '<span class="px-2 py-1 text-xs font-semibold rounded-full bg-blue-200 text-blue-800">In Progress</span>';
                        actionsHtml = `
                            <div class="flex items-center gap-2">
                                <input type="number" id="eta-${taskId}" class="w-20 border rounded px-2 py-1 text-sm" placeholder="ETA (min)" value="${task.eta || ''}">
                                <button onclick="setETA('${taskId}')" class="bg-gray-500 text-white text-xs px-2 py-1 rounded">Set ETA</button>
                                <button onclick="updateTaskStatus('${taskId}', 'Completed')" class="bg-green-500 text-white text-xs font-semibold py-1 px-3 rounded-md">Complete</button>
                            </div>
                        `;
                        break;
                    default:
                        statusHtml = `<span class="px-2 py-1 text-xs font-semibold rounded-full bg-gray-200 text-gray-800">${task.status}</span>`;
                        actionsHtml = '';
                }

                const row = `
                    <tr class="border-b">
                        <td class="px-4 py-3">${task.customerName}</td>
                        <td class="px-4 py-3 text-gray-600">${task.details}</td>
                        <td class="px-4 py-3">${statusHtml}</td>
                        <td class="px-4 py-3">${actionsHtml}</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }
        
        async function registerWorker(e) {
            e.preventDefault();
            const name = document.getElementById('register-name').value;
            const mobile = document.getElementById('register-mobile').value;
            const specialization = document.getElementById('register-specialization').value;

            try {
                const newWorkerRef = db.ref('workers').push();
                const workerData = {
                    id: newWorkerRef.key,
                    name, mobile, specialization
                };
                await newWorkerRef.set(workerData);
                showToast("Registration successful! Please login.");
                document.getElementById('show-login-btn').click();
                document.getElementById('register-form').reset();
            } catch (error) {
                console.error("Registration error:", error);
                showToast("Registration failed.");
            }
        }
        
        async function loginWorker(e) {
            e.preventDefault();
            const mobile = document.getElementById('login-mobile').value;
            
            try {
                const workersRef = db.ref('workers');
                const snapshot = await workersRef.orderByChild('mobile').equalTo(mobile).once('value');
                const workerData = snapshot.val();

                if (workerData) {
                    const workerId = Object.keys(workerData)[0];
                    currentUser = { id: workerId, ...workerData[workerId] };
                    sessionStorage.setItem('loggedInWorker', JSON.stringify(currentUser));
                    showDashboard();
                } else {
                    showToast("Mobile number not registered.");
                }
            } catch (error) {
                console.error("Login error:", error);
                showToast("Login failed.");
            }
        }

        function showDashboard() {
            if (!currentUser) return;
            authView.classList.add('hidden');
            dashboardView.classList.remove('hidden');
            document.getElementById('worker-name').textContent = currentUser.name;
            
            // Listen for tasks assigned to this worker
            const tasksRef = db.ref('workerTasks');
            tasksRef.on('value', (snapshot) => {
                const allTasks = snapshot.val() || {};
                const oldTasks = { ...myTasks };
                myTasks = allTasks;
                displayTasks(myTasks);

                // Check for new tasks assigned to me
                Object.keys(myTasks).forEach(taskId => {
                    const task = myTasks[taskId];
                    if (task.assignedTo === currentUser.id && !oldTasks[taskId]) {
                        const message = `New task assigned: ${task.details} for ${task.customerName}.`;
                        showToast(message);
                        speak(message);
                    }
                });
            });
        }

        async function updateTaskStatus(taskId, newStatus) {
            try {
                await db.ref(`workerTasks/${taskId}/status`).set(newStatus);
                showToast(`Task status updated to ${newStatus}.`);
            } catch (error) {
                console.error("Status update error:", error);
                showToast("Failed to update status.");
            }
        }

        async function setETA(taskId) {
            const etaInput = document.getElementById(`eta-${taskId}`);
            const eta = etaInput.value;
            if (!eta || isNaN(eta)) {
                showToast("Please enter a valid number for ETA.");
                return;
            }
            try {
                await db.ref(`workerTasks/${taskId}/eta`).set(parseInt(eta));
                showToast("ETA updated.");
            } catch (error) {
                console.error("ETA update error:", error);
                showToast("Failed to update ETA.");
            }
        }

        function logout() {
            currentUser = null;
            sessionStorage.removeItem('loggedInWorker');
            if (db) db.ref('workerTasks').off(); // Detach listener
            dashboardView.classList.add('hidden');
            authView.classList.remove('hidden');
        }

        document.addEventListener('DOMContentLoaded', () => {
            try {
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                db = firebase.database();
            } catch (e) {
                console.error("Firebase initialization failed:", e);
                alert("Could not connect to the database.");
            }

            // Check session storage for logged in user
            const savedWorker = sessionStorage.getItem('loggedInWorker');
            if (savedWorker) {
                currentUser = JSON.parse(savedWorker);
                showDashboard();
            }

            // Auth view toggling
            document.getElementById('show-register-btn').addEventListener('click', () => {
                loginSection.classList.add('hidden');
                registerSection.classList.remove('hidden');
            });
            document.getElementById('show-login-btn').addEventListener('click', () => {
                registerSection.classList.add('hidden');
                loginSection.classList.remove('hidden');
            });

            // Form submissions
            document.getElementById('register-form').addEventListener('submit', registerWorker);
            document.getElementById('login-form').addEventListener('submit', loginWorker);
            document.getElementById('logout-btn').addEventListener('click', logout);
        });

        // Make functions globally accessible
        window.updateTaskStatus = updateTaskStatus;
        window.setETA = setETA;
    </script>


<script src="./script.js"></script></body></html>
